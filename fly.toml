# oskol-analysis: the Open Sage backgammon engine behind a private HTTP API.
#
# Private on purpose. The app has a Flycast address and no public IP, so it
# answers only inside the Fly organisation at http://oskol-analysis.flycast
# (Flycast, unlike .internal, goes through the proxy, which is what lets the
# machine stop when idle and start on the next request).

app = 'oskol-analysis'
primary_region = 'sjc'
kill_signal = 'SIGTERM'

[build]

[env]
  PORT = '8080'
  BATCH_WORKERS = '4'

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 32
    soft_limit = 16

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

# Dedicated cores: a review runs every decision at 4-ply across a process
# pool sized to them (app.pool). Shared CPUs throttle sustained work.
[[vm]]
  size = 'performance-8x'
  memory = '16gb'
